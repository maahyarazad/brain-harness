# Brain Harness on EC2: forwards everything (the website and the API) to the Node server.
# Installed by deploy/setup-ec2.sh as /etc/nginx/sites-available/brain-harness.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # HTTPS for the domain. Lines ending in "# ssl" are left out by the deploy when the
    # certificate isn't on the instance yet (create it with: sudo certbot certonly --nginx -d visualization-playground.space).
    listen 443 ssl;                                                                       # ssl
    listen [::]:443 ssl;                                                                  # ssl
    ssl_certificate /etc/letsencrypt/live/visualization-playground.space/fullchain.pem;   # ssl
    ssl_certificate_key /etc/letsencrypt/live/visualization-playground.space/privkey.pem; # ssl
    ssl_protocols TLSv1.2 TLSv1.3;                                                        # ssl
    server_name visualization-playground.space www.visualization-playground.space ec2-13-63-233-210.eu-north-1.compute.amazonaws.com 13.63.233.210;

    # The site is served by the Node server (server/src/routes/site.js): the built
    # web client (rsynced to /var/www/brain-harness/web-client by the "Deploy web
    # client" workflow), the Tetris loading screen, and every page, with its
    # link-preview tags. nginx only forwards requests and compresses the answers.
    gzip on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + MCP endpoint (Node on 127.0.0.1:3000, deployed by "Deploy server")
    location ~ ^/(api/|health$|mcp$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat can take a while (tool calls + model time)
        proxy_read_timeout 90s;
        # MCP Streamable HTTP responses are server-sent events
        proxy_buffering off;
    }
}
