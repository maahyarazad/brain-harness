# Brain Harness on EC2, plain HTTP only (no TLS, no redirect).
# Alternative to nginx-brain-harness.conf; install one of them as
# /etc/nginx/sites-available/brain-harness and enable it.
# Note: browsers only allow microphone (voice input) on HTTPS pages.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ec2-13-63-233-210.eu-north-1.compute.amazonaws.com 13.63.233.210;

    # Playground (built web-client, deployed by the "Deploy web client" workflow)
    root /var/www/brain-harness/web-client;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + MCP endpoint (Node on 127.0.0.1:3000, deployed by "Deploy server")
    location ~ ^/(api/|health$|mcp$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat can take a while (tool calls + model time)
        proxy_read_timeout 90s;
        # MCP Streamable HTTP responses are server-sent events
        proxy_buffering off;
    }
}
