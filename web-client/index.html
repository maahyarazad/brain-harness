<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, icon and Open Graph tags: written by build/openGraph.js -->
    <!--og:start-->
    <title>Visualization Playground by Maahyar Azad</title>
    <!--og:end-->
    <!-- Loading screen styles: inline so they apply before any CSS file arrives (src/boot/) -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #f7f7f5;
        color: #1d1d1b;
        transition: opacity 0.3s;
      }
      #boot-anim {
        width: 100px;
        height: 100px;
        max-width: 100px;
        max-height: 100px;
      }
      #boot-anim dotlottie-wc {
        display: block;
        width: 100px;
        height: 100px;
        max-width: 100px;
        max-height: 100px;
      }
      #boot-percent {
        font: 14px system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .boot-loader--done {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader {
          background: #161615;
          color: #ececea;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading">
      <div id="boot-anim"></div>
      <span id="boot-percent">0%</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/boot/index.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
