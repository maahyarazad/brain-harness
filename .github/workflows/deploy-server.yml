name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/brain-harness.service"
      - "deploy/nginx-brain-harness.conf"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  EC2_HOST: 13.63.233.210
  EC2_USER: ubuntu
  APP_DIR: /var/www/brain-harness/server
  CORS_ORIGIN: https://visualization-playground.space
  # Where the "Deploy web client" workflow puts the built client; the server serves it
  WEB_ROOT: /var/www/brain-harness/web-client

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and test
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if ! printf '%s' "$EC2_SSH_KEY" | grep -q -- "-----BEGIN .*PRIVATE KEY-----"; then
            echo "::error::EC2_SSH_KEY must be the PRIVATE key file (starts with -----BEGIN ... PRIVATE KEY-----), not the ssh-ed25519/ssh-rsa public key line."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Can't reach $EC2_HOST on port 22 from the GitHub runner. Allow inbound SSH (22) in the EC2 security group for GitHub Actions runners."
            exit 1
          fi

      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .env --exclude test \
            -e "ssh -i ~/.ssh/ec2" \
            server/ "$EC2_USER@$EC2_HOST:$APP_DIR/"

      - name: Write server .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
        run: |
          # Sent over stdin so the key never appears in a command line or log
          printf '%s\n' \
            "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" \
            "ANTHROPIC_MODEL=$ANTHROPIC_MODEL" \
            "PORT=3000" \
            "HOST=127.0.0.1" \
            "WEB_ROOT=$WEB_ROOT" \
          | ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" "umask 077 && cat > $APP_DIR/.env"

      - name: Install the systemd unit
        run: |
          # Keeps the unit in step with deploy/brain-harness.service, and recreates it
          # if the instance never had it ("Unit brain-harness.service not found").
          # Sent over stdin, like the .env above.
          ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" "
            set -e
            sudo tee /etc/systemd/system/brain-harness.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable brain-harness
          " < deploy/brain-harness.service

      - name: Install dependencies and restart
        run: |
          ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" "
            set -e
            cd $APP_DIR
            npm ci --omit=dev
            sudo systemctl restart brain-harness
            curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health
          "

      - name: Install the nginx site
        run: |
          # After the restart above, so nginx never forwards pages to a server that can't serve them yet
          ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" "
            set -e
            sudo tee /etc/nginx/sites-available/brain-harness > /dev/null
            sudo nginx -t
            sudo systemctl reload nginx
          " < deploy/nginx-brain-harness.conf

      # - name: Check public health endpoint
      #   run: curl -fsS --retry 5 --retry-delay 3 "$CORS_ORIGIN/health"

      - name: Check the site pages are served by the server
        run: |
          curl -fsS "$CORS_ORIGIN/tetris-loop.lottie" -o /dev/null
          # The pages come from the client's build: before the first "Deploy web client" there are none
          curl -fsS "$CORS_ORIGIN/" | grep -q 'id="boot-loader"' \
            || echo "::warning::/ has no loading screen: run the \"Deploy web client\" workflow (the server serves the client from WEB_ROOT)."
