name: Deploy web client

on:
  push:
    branches: [main]
    paths:
      - "web-client/**"
      - ".github/workflows/deploy-web-client.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-client
  cancel-in-progress: false

env:
  EC2_HOST: 13.63.233.210
  APP_DIR: /var/www/brain-harness/web-client
  PUBLIC_URL: https://ec2-13-63-233-210.eu-north-1.compute.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install, test and build
        working-directory: web-client
        env:
          # Empty = same origin (nginx proxies /api to the server).
          # Set the API_BASE_URL repository variable to call the server elsewhere.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          printf 'Host ec2\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/ec2\n' "$EC2_HOST" > ~/.ssh/config

      - name: Upload build
        run: rsync -az --delete web-client/dist/ "ec2:$APP_DIR/"

      - name: Check the page is served
        # -k: the certificate is self-signed
        run: curl -fsSk --retry 5 --retry-delay 3 "$PUBLIC_URL/" | grep -q "<title>Brain Harness</title>"
