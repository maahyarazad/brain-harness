name: Deploy web client

on:
  push:
    branches: [main]
    paths:
      - "web-client/**"
      - ".github/workflows/deploy-web-client.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-client
  cancel-in-progress: false

env:
  EC2_HOST: 13.63.233.210
  EC2_USER: ubuntu
  APP_DIR: /var/www/brain-harness/web-client
  PUBLIC_URL: http://ec2-13-63-233-210.eu-north-1.compute.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install, test and build
        working-directory: web-client
        env:
          # Empty = same origin (nginx proxies /api to the server).
          # Set the API_BASE_URL repository variable to call the server elsewhere.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if ! printf '%s' "$EC2_SSH_KEY" | grep -q -- "-----BEGIN .*PRIVATE KEY-----"; then
            echo "::error::EC2_SSH_KEY must be the PRIVATE key file (starts with -----BEGIN ... PRIVATE KEY-----), not the ssh-ed25519/ssh-rsa public key line."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          # Fails if the key has a passphrase or is damaged. The fingerprint is
          # safe to log; compare it with `ssh-keygen -lf ~/.ssh/authorized_keys` on the server.
          if ! ssh-keygen -y -P "" -f ~/.ssh/ec2 > ~/.ssh/ec2.pub; then
            echo "::error::EC2_SSH_KEY can't be loaded: it has a passphrase or wasn't copied completely. Use a key made with: ssh-keygen -t ed25519 -N \"\""
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/ec2.pub)"
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Can't reach $EC2_HOST on port 22 from the GitHub runner. Allow inbound SSH (22) in the EC2 security group for GitHub Actions runners."
            exit 1
          fi

      - name: Upload build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2" \
            web-client/dist/ "$EC2_USER@$EC2_HOST:$APP_DIR/"

      - name: Check the page is served
        run: curl -fsS --retry 5 --retry-delay 3 "$PUBLIC_URL/" | grep -q "<title>Brain Harness</title>"
